name: Build Charger Watch APK

on:
  push:
    branches:
      - charger-watch-build-20260804
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: charger-watch-build
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp charger-watch-build/app/build/outputs/apk/debug/app-debug.apk Charger-Watch.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Charger-Watch-APK
          path: Charger-Watch.apk
          if-no-files-found: error
          retention-days: 7
