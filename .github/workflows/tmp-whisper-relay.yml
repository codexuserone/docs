name: Temporary Whisper Medium Relay

on:
  push:
    branches:
      - tmp-whisper-medium-relay

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download multilingual Whisper Medium Q5
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-medium-q5_0.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium-q5_0.bin?download=true'
          ls -lh ggml-medium-q5_0.bin
          test -s ggml-medium-q5_0.bin
          sha256sum ggml-medium-q5_0.bin | tee ggml-medium-q5_0.sha256
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-medium-q5-model
          path: |
            ggml-medium-q5_0.bin
            ggml-medium-q5_0.sha256
          compression-level: 0
          retention-days: 1
